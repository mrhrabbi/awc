<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মির রাব্বি হোসেন</title>
    <!-- SolaimanLipi Font -->
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0eafc, #cfdef3);
            --text-color: #2c3e50;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --text-color: #f1f1f1;
            --glass-bg: rgba(0, 0, 0, 0.3);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SolaimanLipi', sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header */
        header {
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-btn, .menu-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -250px;
            width: 250px;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-left: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            z-index: 200;
            transition: right 0.3s ease;
            padding: 20px;
        }

        .sidebar.active {
            right: 0;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            float: right;
        }

        .sidebar-links {
            list-style: none;
            margin-top: 50px;
        }

        .sidebar-links li {
            margin: 20px 0;
        }

        .sidebar-links a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 1.2rem;
        }

        /* Container */
        .container {
            width: 90%;
            max-width: 800px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        /* Date & Time Box */
        .time-box {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .clock {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .date-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            font-size: 1.1rem;
        }

        /* Hadith Glassmorphism Card with Animation */
        .hadith-card {
            width: 100%;
            padding: 30px;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            animation: pulseGlow 4s infinite alternate;
            position: relative;
        }

        .hadith-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #ffb703;
        }

        .hadith-text {
            font-size: 1.3rem;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .hadith-ref {
            font-size: 1rem;
            opacity: 0.8;
            font-style: italic;
        }

        /* Animation */
        @keyframes pulseGlow {
            0% {
                transform: translateY(0);
                box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            }
            100% {
                transform: translateY(-5px);
                box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.3);
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-title">মীর রাব্বি হোসেন</div>
        <div class="header-controls">
            <button class="theme-btn" onclick="toggleTheme()" id="themeIcon">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="menu-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        <ul class="sidebar-links">
            <li><a href="#"><i class="fa-solid fa-house"></i> হোম</a></li>
            <li><a href="#"><i class="fa-solid fa-book-open"></i> হাদিস</a></li>
            <li><a href="#"><i class="fa-solid fa-user"></i> প্রোফাইল</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Time and Date Section -->
        <div class="time-box">
            <div class="clock" id="clock">00:00:00</div>
            <div class="date-list">
                <span id="engDate">ইংরেজি: -</span> |
                <span id="banglaDate">বাংলা: -</span> |
                <span id="hijriDate">আরবি: -</span>
            </div>
        </div>

        <!-- Animated Hadith Glass Box -->
        <div class="hadith-card">
            <div class="hadith-icon">
                <i class="fa-solid fa-quote-left"></i>
            </div>
            <div class="hadith-text">
                "উত্তম কদাচার বর্জন করা এবং উত্তম চরিত্র গ্রহণ করাই হলো প্রকৃত ধার্মিকতা।"
            </div>
            <div class="hadith-ref">— সহীহ মুসলিম</div>
        </div>

    </div>

    <script>
        // Toggle Dark/Light Mode
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            if (html.getAttribute('data-theme') === 'light') {
                html.setAttribute('data-theme', 'dark');
                themeIcon.innerHTML = '<i class="fa-solid fa-sun"></i>';
            } else {
                html.setAttribute('data-theme', 'light');
                themeIcon.innerHTML = '<i class="fa-solid fa-moon"></i>';
            }
        }

        // Toggle Sidebar
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // Clock & Date Functions
        function updateDateTime() {
            const now = new Date();
            
            // Time
            const timeStr = now.toLocaleTimeString('bn-BD', { hour12: true });
            const dayName = now.toLocaleDateString('bn-BD', { weekday: 'long' });
            document.getElementById('clock').innerText = `${dayName}, ${timeStr}`;

            // English Date (in Bengali Numbers)
            const engDate = now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('engDate').innerText = `ইংরেজি: ${engDate}`;

            // Bangla & Hijri Dates using Intl Calendar
            try {
                const banglaFormatter = new Intl.DateTimeFormat('bn-BD-u-ca-bengali', { day: 'numeric', month: 'long', year: 'numeric' });
                document.getElementById('banglaDate').innerText = `বাংলা: ${banglaFormatter.format(now)}`;

                const hijriFormatter = new Intl.DateTimeFormat('bn-BD-u-ca-islamic-umalqura', { day: 'numeric', month: 'long', year: 'numeric' });
                document.getElementById('hijriDate').innerText = `আরবি: ${hijriFormatter.format(now)}`;
            } catch (e) {
                document.getElementById('banglaDate').innerText = `বাংলা: তারিখ নির্ধারণে অক্ষম`;
                document.getElementById('hijriDate').innerText = `আরবি: তারিখ নির্ধারণে অক্ষম`;
            }
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>
</html>
