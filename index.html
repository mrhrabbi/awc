<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>তথ্যবহুল চ্যাটবট</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 380px;
            max-width: 100%;
            height: 550px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #0084ff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
        }

        .bot-message {
            background-color: #e4e6eb;
            color: #000;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user-message {
            background-color: #0084ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .input-container {
            display: flex;
            border-top: 1px solid #ddd;
            padding: 10px;
            background: #fff;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }

        button {
            background-color: #0084ff;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-left: 8px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #006bce;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">সহযোগিতা চ্যাটবট</div>
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">হ্যালো! আমি আপনাকে কীভাবে সাহায্য করতে পারি? (উদাহরণ: 'কোার্স', 'ঠিকানা', 'সময়')</div>
    </div>
    <div class="input-container">
        <input type="text" id="userInput" placeholder="এখানে লিখুন..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    // প্রি-লোডেড তথ্য (Knowledge Base)
    const knowledgeBase = {
        "হ্যালো": "হ্যালো! কেমন আছেন? কীভাবে সাহায্য করতে পারি?",
        "হাই": "হাই! আমি আপনাকে কীভাবে সাহায্য করতে পারি?",
        "কোার্স": "আমাদের এখানে ওয়েব ডেভেলপমেন্ট, পাইথন এবং ডিজিটাল মার্কেটিং কোর্স চালু আছে।",
        "ঠিকানা": "আমাদের অফিস ঢাকা, ধানমন্ডি ৩২ নম্বর রোডে অবস্থিত।",
        "সময়": "আমাদের সেবা সপ্তাহের রবি থেকে বৃহস্পতিবার, সকাল ৯টা থেকে সন্ধ্যা ৬টা পর্যন্ত খোলা থাকে।",
        "যোগাযোগ": "আপনি আমাদের ইমেইল করতে পারেন: support@example.com অথবা কল করুন: ০১৭০০০০০০০০",
        "ধন্যবাদ": "আপনাকেও ধন্যবাদ! ভালো থাকবেন।"
    };

    function sendMessage() {
        const inputField = document.getElementById("userInput");
        const userText = inputField.value.trim();

        if (userText === "") return;

        // ইউজার মেসেজ দেখানো
        appendMessage(userText, "user-message");
        inputField.value = "";

        // বট মেসেজ প্রসেসিং
        setTimeout(() => {
            const botResponse = getBotResponse(userText);
            appendMessage(botResponse, "bot-message");
        }, 500);
    }

    function getBotResponse(input) {
        const cleanInput = input.toLowerCase();
        
        // তথ্য খোঁজা
        for (let key in knowledgeBase) {
            if (cleanInput.includes(key)) {
                return knowledgeBase[key];
            }
        }
        
        // তথ্য না পাওয়া গেলে ডিফল্ট উত্তর
        return "দুঃখিত, এই বিষয়ে আমার কাছে তথ্য নেই। আপনি চাইলে আমাদের সাপোর্ট নাম্বারে যোগাযোগ করতে পারেন।";
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById("chatBox");
        const messageElement = document.createElement("div");
        messageElement.classList.add("message", className);
        messageElement.innerText = text;
        chatBox.appendChild(messageElement);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
